<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  
  <!-- Diamond shape (VerexTopUp brand) -->
  <g transform="translate(256, 240)">
    <!-- Top facet -->
    <polygon points="0,-110 90,-40 0,-20 -90,-40" fill="#FFFFFF" opacity="0.95"/>
    <!-- Left facet -->
    <polygon points="-90,-40 0,-20 0,110 -70,40" fill="#E0D5FF" opacity="0.9"/>
    <!-- Right facet -->
    <polygon points="90,-40 0,-20 0,110 70,40" fill="#C4B5FD" opacity="0.95"/>
    <!-- Bottom shine -->
    <polygon points="0,20 70,40 0,110 -70,40" fill="#FFFFFF" opacity="0.3"/>
  </g>
  
  <!-- Text below -->
  <text x="256" y="440" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="900" fill="#FFFFFF" letter-spacing="2">VEREX</text>
</svg>